name: Build CodeSeed Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Validate optional ACR configuration
        id: acr
        shell: bash
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [[ -z "$ACR_REGISTRY" && -z "$ACR_NAMESPACE" && -z "$ACR_REPOSITORY" && -z "$ACR_USERNAME" && -z "$ACR_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ACR push skipped: configure ACR_REGISTRY, ACR_NAMESPACE, ACR_REPOSITORY, ACR_USERNAME, and ACR_PASSWORD to enable it. GHCR push remains enabled."
            exit 0
          fi

          missing=()
          [[ -z "$ACR_REGISTRY" ]] && missing+=("ACR_REGISTRY variable")
          [[ -z "$ACR_NAMESPACE" ]] && missing+=("ACR_NAMESPACE variable")
          [[ -z "$ACR_REPOSITORY" ]] && missing+=("ACR_REPOSITORY variable")
          [[ -z "$ACR_USERNAME" ]] && missing+=("ACR_USERNAME secret")
          [[ -z "$ACR_PASSWORD" ]] && missing+=("ACR_PASSWORD secret")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Incomplete ACR configuration. Missing: ${missing[*]}. No ACR login or push will be attempted."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Prepare image tags
        id: images
        shell: bash
        env:
          ACR_ENABLED: ${{ steps.acr.outputs.enabled }}
          ACR_IMAGE: ${{ steps.acr.outputs.image }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "${IMAGE}:latest"
            if [[ "$ACR_ENABLED" == "true" ]]; then
              echo "${ACR_IMAGE}:sha-${GITHUB_SHA}"
              echo "${ACR_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
