name: codeseed

services:
  db:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - codeseed_mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-codeseed-init.sql:ro
    networks:
      - codeseed-internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping --protocol=TCP --host=127.0.0.1 --port=3306
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      COMMENTS_PUBLIC: ${COMMENTS_PUBLIC:-false}
      COMMENTS_TRUST_PROXY: ${COMMENTS_TRUST_PROXY:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    ports:
      - '${WEB_PORT:-18080}:3000'
    networks:
      - codeseed-internal

networks:
  codeseed-internal:
    internal: true

volumes:
  codeseed_mysql_data:
